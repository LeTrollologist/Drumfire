[workspace]
members = ["crates/model", "crates/core", "crates/ns", "crates/gui", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
rust-version = "1.85"
authors = ["Drumfire contributors"]
description = "Deterministic battle resolution for NationStates roleplay"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "1.0"
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
quick-xml = "0.41"
urlencoding = "2.1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }

# The MSVC toolchain in this environment miscompiles ring's C sources when
# cc-rs passes -Z7 for debug info. Debug info is not needed for normal
# development here; release builds are unaffected.
[profile.dev]
debug = 0
